<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adwaita Auth</title>
    
    <!-- Configuração do Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'media', // Automático baseado no sistema operacional
            theme: {
                extend: {
                    colors: {
                        window: {
                            light: '#f6f5f4',
                            dark: '#242424'
                        },
                        view: {
                            light: '#ffffff',
                            dark: '#2d2d2d'
                        },
                        accent: {
                            DEFAULT: '#3584e4',
                            hover: '#1c71d8'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'Cantarell', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Fontes e Ajustes Finos -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Checkbox estilo Adwaita */
        input[type="checkbox"] {
            accent-color: #3584e4;
        }
        
        /* Remove o ícone de 'olho' padrão do Edge para inputs de senha */
        input[type="password"]::-ms-reveal,
        input[type="password"]::-ms-clear {
            display: none;
        }
    </style>
</head>
<body class="bg-window-light dark:bg-window-dark text-gray-900 dark:text-gray-100 min-h-screen flex items-center justify-center p-4">

    <!-- Card Principal / Surface -->
    <div class="w-full max-w-md bg-view-light dark:bg-view-dark rounded-[12px] border border-black/5 dark:border-white/5 shadow-sm overflow-hidden transition-all duration-300 ease-in-out">
        
        <div class="p-8">
            <!-- Cabeçalho -->
            <div class="text-center mb-8">
                <h1 id="form-title" class="text-2xl font-bold tracking-tight text-gray-900 dark:text-white">Sign In</h1>
                <p id="form-subtitle" class="text-sm text-black/60 dark:text-white/60 mt-2 font-medium">Sign in to your account to continue</p>
            </div>

            <!-- Formulário de Login -->
            <form id="login-form" class="space-y-5 transition-opacity duration-300">
                <div class="space-y-1.5">
                    <label for="email" class="block text-sm font-medium text-black/60 dark:text-white/60 ml-1">Email</label>
                    <input type="email" id="email" class="w-full bg-black/5 dark:bg-white/5 border-transparent rounded-[12px] px-4 py-3 text-sm focus:bg-white dark:focus:bg-[#353535] focus:border-transparent focus:ring-2 focus:ring-accent outline-none transition-all placeholder-black/30 dark:placeholder-white/30" placeholder="you@example.com">
                </div>

                <div class="space-y-1.5">
                    <div class="flex items-center justify-between ml-1">
                        <label for="password" class="block text-sm font-medium text-black/60 dark:text-white/60">Password</label>
                        <a href="#" class="text-sm font-medium text-accent hover:text-accent-hover transition-colors">Forgot password?</a>
                    </div>
                    <input type="password" id="password" class="w-full bg-black/5 dark:bg-white/5 border-transparent rounded-[12px] px-4 py-3 text-sm focus:bg-white dark:focus:bg-[#353535] focus:border-transparent focus:ring-2 focus:ring-accent outline-none transition-all placeholder-black/30 dark:placeholder-white/30" placeholder="••••••••">
                </div>

                <div class="flex items-center ml-1 pt-1">
                    <input type="checkbox" id="remember" class="w-4 h-4 rounded text-accent bg-black/5 dark:bg-white/5 border-transparent focus:ring-2 focus:ring-accent focus:ring-offset-0 cursor-pointer">
                    <label for="remember" class="ml-2.5 block text-sm font-medium text-black/70 dark:text-white/70 cursor-pointer select-none">Remember me</label>
                </div>

                <button type="submit" class="w-full bg-accent hover:bg-accent-hover text-white font-semibold py-3 px-4 rounded-[12px] transition-colors mt-2 focus:outline-none focus:ring-2 focus:ring-accent focus:ring-offset-2 dark:focus:ring-offset-view-dark shadow-sm">
                    Sign In
                </button>
            </form>

            <!-- Formulário de Cadastro -->
            <form id="signup-form" class="space-y-5 hidden transition-opacity duration-300">
                <div class="space-y-1.5">
                    <label for="name-signup" class="block text-sm font-medium text-black/60 dark:text-white/60 ml-1">Full Name</label>
                    <input type="text" id="name-signup" class="w-full bg-black/5 dark:bg-white/5 border-transparent rounded-[12px] px-4 py-3 text-sm focus:bg-white dark:focus:bg-[#353535] focus:border-transparent focus:ring-2 focus:ring-accent outline-none transition-all placeholder-black/30 dark:placeholder-white/30" placeholder="Your name">
                </div>

                <div class="space-y-1.5">
                    <label for="email-signup" class="block text-sm font-medium text-black/60 dark:text-white/60 ml-1">Email</label>
                    <input type="email" id="email-signup" class="w-full bg-black/5 dark:bg-white/5 border-transparent rounded-[12px] px-4 py-3 text-sm focus:bg-white dark:focus:bg-[#353535] focus:border-transparent focus:ring-2 focus:ring-accent outline-none transition-all placeholder-black/30 dark:placeholder-white/30" placeholder="you@example.com">
                </div>

                <div class="space-y-1.5">
                    <label for="password-signup" class="block text-sm font-medium text-black/60 dark:text-white/60 ml-1">Password</label>
                    <input type="password" id="password-signup" class="w-full bg-black/5 dark:bg-white/5 border-transparent rounded-[12px] px-4 py-3 text-sm focus:bg-white dark:focus:bg-[#353535] focus:border-transparent focus:ring-2 focus:ring-accent outline-none transition-all placeholder-black/30 dark:placeholder-white/30" placeholder="••••••••">
                </div>

                <div class="space-y-1.5">
                    <label for="password-confirm" class="block text-sm font-medium text-black/60 dark:text-white/60 ml-1">Confirm Password</label>
                    <input type="password" id="password-confirm" class="w-full bg-black/5 dark:bg-white/5 border-transparent rounded-[12px] px-4 py-3 text-sm focus:bg-white dark:focus:bg-[#353535] focus:border-transparent focus:ring-2 focus:ring-accent outline-none transition-all placeholder-black/30 dark:placeholder-white/30" placeholder="••••••••">
                </div>

                <div class="flex items-center ml-1 pt-1">
                    <input type="checkbox" id="terms" class="w-4 h-4 rounded text-accent bg-black/5 dark:bg-white/5 border-transparent focus:ring-2 focus:ring-accent focus:ring-offset-0 cursor-pointer">
                    <label for="terms" class="ml-2.5 block text-sm font-medium text-black/70 dark:text-white/70 cursor-pointer select-none">I agree to the <a href="#" class="text-accent hover:text-accent-hover transition-colors">Terms</a></label>
                </div>

                <button type="submit" class="w-full bg-accent hover:bg-accent-hover text-white font-semibold py-3 px-4 rounded-[12px] transition-colors mt-2 focus:outline-none focus:ring-2 focus:ring-accent focus:ring-offset-2 dark:focus:ring-offset-view-dark shadow-sm">
                    Create Account
                </button>
            </form>

            <!-- Toggle de Navegação -->
            <div class="mt-8 pt-6 border-t border-black/5 dark:border-white/5 text-center">
                <p id="toggle-text" class="text-sm text-black/60 dark:text-white/60 font-medium">Don't have an account?</p>
                <button id="toggle-btn" class="mt-1.5 text-sm font-semibold text-accent hover:text-accent-hover transition-colors focus:outline-none focus:ring-2 focus:ring-accent focus:ring-offset-4 dark:focus:ring-offset-view-dark rounded px-2 py-0.5">
                    Create an account
                </button>
            </div>
        </div>
    </div>

    <!-- Lógica de Alternância Simples -->
    <script>
        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form');
        const formTitle = document.getElementById('form-title');
        const formSubtitle = document.getElementById('form-subtitle');
        const toggleText = document.getElementById('toggle-text');
        const toggleBtn = document.getElementById('toggle-btn');
        
        let isLogin = true;

        toggleBtn.addEventListener('click', () => {
            isLogin = !isLogin;
            
            if (isLogin) {
                // Alternar para estado de Login
                signupForm.classList.add('hidden');
                loginForm.classList.remove('hidden');
                
                formTitle.textContent = 'Sign In';
                formSubtitle.textContent = 'Sign in to your account to continue';
                
                toggleText.textContent = "Don't have an account?";
                toggleBtn.textContent = 'Create an account';
            } else {
                // Alternar para estado de Cadastro
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                
                formTitle.textContent = 'Create Account';
                formSubtitle.textContent = 'Fill in the details below';
                
                toggleText.textContent = 'Already have an account?';
                toggleBtn.textContent = 'Sign in';
            }
        });

        // Prevenir envio dos forms para demonstração
        loginForm.addEventListener('submit', (e) => e.preventDefault());
        signupForm.addEventListener('submit', (e) => e.preventDefault());
    </script>
</body>
</html>
